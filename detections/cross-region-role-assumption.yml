# Detection Rule: IAM Role Assumption from Unusual Region
# Generated by: threat-hunter-agent
id: DET-004
name: Cross-Region Role Assumption (Anomalous)
description: >
  Detects IAM role assumptions originating from AWS regions not in the
  organization's approved region list. May indicate lateral movement
  from a compromised resource in an unused region.
mitre_technique: T1550.001 - Application Access Token
severity: medium
author: threat-hunter-agent
last_updated: "2026-07-22"
data_sources:
  - cloudtrail
logic:
  type: anomaly
  query: >
    eventName = "AssumeRole"
    AND awsRegion NOT IN (approved_regions)
    AND userIdentity.type != "AWSService"
  threshold: 3
  window: 15m
response:
  - notify_soc
  - enrich_role_history
tags:
  - lateral-movement
  - defense-evasion

# Detection Rule: Root Account Usage
# Generated by: human
id: DET-002
name: Root Account Console Login
description: >
  Detects any usage of the AWS root account. Root should never be used
  for day-to-day operations. Any login triggers immediate P1 escalation.
mitre_technique: T1078.004 - Cloud Accounts
severity: critical
author: human
last_updated: "2026-07-14"
data_sources:
  - cloudtrail
logic:
  type: simple
  query: >
    userIdentity.type = "Root"
    AND eventName IN ("ConsoleLogin", "CreateAccessKey", "PutUserPolicy")
  threshold: 1
  window: 1m
response:
  - page_oncall
  - lock_account
  - create_incident
tags:
  - privilege-escalation
  - persistence

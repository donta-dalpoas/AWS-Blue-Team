# Detection Rule: S3 Bucket Policy Change
# Generated by: compliance-auditor-agent
id: DET-003
name: S3 Bucket Policy Made Public
description: >
  Detects when an S3 bucket policy is modified to allow public access.
  This is a common data exfiltration vector.
mitre_technique: T1537 - Transfer Data to Cloud Account
severity: high
author: compliance-auditor-agent
last_updated: "2026-07-20"
data_sources:
  - cloudtrail
  - s3-access-logs
logic:
  type: simple
  query: >
    eventName IN ("PutBucketPolicy", "PutBucketAcl", "PutPublicAccessBlock")
    AND requestParameters.policy CONTAINS "\"Effect\":\"Allow\""
    AND requestParameters.policy CONTAINS "\"Principal\":\"*\""
  threshold: 1
  window: 1m
response:
  - notify_soc
  - revert_policy
  - create_incident
tags:
  - exfiltration
  - collection

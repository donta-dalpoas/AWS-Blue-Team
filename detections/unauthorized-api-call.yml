# Detection Rule: Unauthorized API Call
# Generated by: human
id: DET-001
name: Unauthorized API Call from Unknown IP
description: >
  Detects API calls from IP addresses not in the known-good baseline.
  Triggers when CloudTrail logs show API activity from unrecognized source IPs.
mitre_technique: T1078 - Valid Accounts
severity: critical
author: human
last_updated: "2026-07-14"
data_sources:
  - cloudtrail
  - vpc-flow-logs
logic:
  type: correlation
  query: >
    sourceIPAddress NOT IN (SELECT ip FROM baseline_ips)
    AND eventType = "AwsApiCall"
    AND errorCode IS NULL
  threshold: 1
  window: 5m
response:
  - notify_soc
  - enrich_ip_reputation
  - create_incident
tags:
  - initial-access
  - credential-abuse
